<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- WrongUIᴎverse mark: pixel "UI" in electric cyan, mirrored N in anomaly violet. -->
  <rect width="16" height="16" rx="2" fill="#090b18"/>
  <g fill="#38e8ff">
    <!-- U -->
    <rect x="1" y="4" width="1" height="7"/>
    <rect x="4" y="4" width="1" height="7"/>
    <rect x="1" y="11" width="4" height="1"/>
    <!-- I -->
    <rect x="6" y="4" width="3" height="1"/>
    <rect x="7" y="4" width="1" height="8"/>
    <rect x="6" y="11" width="3" height="1"/>
  </g>
  <g fill="#b46cff">
    <!-- N, flipped horizontally: the diagonal climbs left to right -->
    <rect x="10" y="4" width="1" height="8"/>
    <rect x="14" y="4" width="1" height="8"/>
    <rect x="11" y="8" width="1" height="3"/>
    <rect x="12" y="6" width="1" height="3"/>
    <rect x="13" y="4" width="1" height="3"/>
  </g>
</svg>
